[package]
name = "handl-plugin-compile-llvm"
version.workspace = true
edition.workspace = true
description = "LLVM compiler for the Handl arrow calculus (ADR-0114 Phase 8)."
license.workspace = true
repository.workspace = true

[dependencies]
# ADR-0128 Phase 6: platform crates are git deps; the workspace-root
# `[patch]` resolves them from the sibling `../platform` checkout.
handl-plugin-compile = { git = "https://github.com/handl-lang/platform", rev = "200602a6c25a3288f3b6266e0b8fc63822a76365" }
handl-language = { git = "https://github.com/handl-lang/platform", rev = "200602a6c25a3288f3b6266e0b8fc63822a76365" }
plugin-engine = { git = "https://github.com/handl-lang/platform", rev = "200602a6c25a3288f3b6266e0b8fc63822a76365" }
plugin-engine-typecheck = { git = "https://github.com/handl-lang/platform", rev = "200602a6c25a3288f3b6266e0b8fc63822a76365", package = "handl-plugin-engine-typecheck" }
serde_json = "1"

inkwell = { version = "0.5", optional = true }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "compile_benchmark"
harness = false

[features]
default = []
inkwell = ["dep:inkwell"]
